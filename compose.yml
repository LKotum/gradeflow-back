services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    environment:
      PG_URL: postgres://user:pass@postgres:5432/edb?sslmode=disable
      HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started

  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on:
  #     nginx:
  #       condition: service_started

volumes:
  pgdata: {}
