services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradeflow
      POSTGRES_USER: gradeflow
      POSTGRES_PASSWORD: gradeflow
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeflow -d gradeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
    - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PG_URL: postgres://gradeflow:gradeflow@postgres:5432/gradeflow?sslmode=disable
      HTTP_ADDR: :8080
      API_BASE_PATH: /api
      APP_URL: http://localhost:8080
      JWT_SECRET: devsecret
      ACCESS_TTL: 15m
      REFRESH_TTL: 720h
      CORS: http://localhost:5173
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_AVATARS: avatars
      MINIO_BUCKET_REPORTS: reports
      LOG_STDOUT: "true"
      REDIS_ADDR: redis:6379
    ports:
      - 8080:8080
    volumes:
      - .:/app
    working_dir: /app
    command: ["go", "run", "./cmd/api"]

  frontend:
    image: node:22
    working_dir: /frontend
    depends_on:
      - backend
    environment:
      TE_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ../gradleflow-front:/frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - 5173:5173

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  postgres_data:
  minio_data:
