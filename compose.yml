services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - 15432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - 6379:6379

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data

  api:
    build: .
    environment:
      PG_URL: postgres://user:pass@postgres:5432/edb?sslmode=disable
      HTTP_ADDR: :8080
      APP_URL: http://localhost:8080
      JWT_SECRET: devsecret
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: noreply@example.local
      SMTP_FROM_NAME: GradeFlow Local
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - 8025:8025
      - 1025:1025

  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on:
  #     nginx:
  #       condition: service_started

volumes:
  pgdata: {}
  minio-data: {}
