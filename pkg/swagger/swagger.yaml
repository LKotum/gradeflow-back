basePath: /
definitions:
  models.UserRole:
    enum:
    - admin
    - dean
    - teacher
    - student
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleDean
    - UserRoleTeacher
    - UserRoleStudent
  request.AssignStudentToGroupRequest:
    properties:
      studentIds:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - studentIds
    type: object
  request.AssignTeacherRequest:
    properties:
      teacherId:
        type: string
    required:
    - teacherId
    type: object
  request.AttachGroupRequest:
    properties:
      groupId:
        type: string
    required:
    - groupId
    type: object
  request.ChangePasswordRequest:
    properties:
      currentPassword:
        minLength: 8
        type: string
      newPassword:
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  request.CreateDeanRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      password:
        minLength: 8
        type: string
      position:
        type: string
    required:
    - firstName
    - lastName
    - password
    type: object
  request.CreateGroupRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  request.CreateStudentRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      groupId:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - firstName
    - lastName
    - password
    type: object
  request.CreateSubjectRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    required:
    - code
    - name
    type: object
  request.CreateTeacherRequest:
    properties:
      bio:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      password:
        minLength: 8
        type: string
      title:
        type: string
    required:
    - firstName
    - lastName
    - password
    type: object
  request.GradeUpdateRequest:
    properties:
      notes:
        type: string
      value:
        maximum: 5
        minimum: 2
        type: number
    required:
    - value
    type: object
  request.GradeUpsertRequest:
    properties:
      notes:
        type: string
      sessionId:
        type: string
      studentId:
        type: string
      value:
        maximum: 5
        minimum: 2
        type: number
    required:
    - sessionId
    - studentId
    - value
    type: object
  request.INSLoginRequest:
    properties:
      ins:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - ins
    - password
    type: object
  request.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  request.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  request.ScheduleSessionRequest:
    properties:
      date:
        type: string
      groupIds:
        items:
          type: string
        minItems: 1
        type: array
      slot:
        maximum: 6
        minimum: 1
        type: integer
      subjectId:
        type: string
      teacherId:
        type: string
      topic:
        type: string
    required:
    - date
    - groupIds
    - slot
    - subjectId
    - teacherId
    type: object
  request.UpdateDeanRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      position:
        type: string
    type: object
  request.UpdateGradeRequest:
    properties:
      notes:
        type: string
      value:
        maximum: 5
        minimum: 2
        type: number
    required:
    - value
    type: object
  request.UpdateGroupRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  request.UpdateStudentRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      groupId:
        type: string
      lastName:
        type: string
      middleName:
        type: string
    type: object
  request.UpdateSubjectRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  request.UpdateTeacherRequest:
    properties:
      bio:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      title:
        type: string
    type: object
  request.UpdateUserRequest:
    properties:
      bio:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      position:
        type: string
      title:
        type: string
    type: object
  response.AuthResponse:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/response.UserSummary'
    type: object
  response.AverageMetricResponse:
    properties:
      groupAverage:
        type: number
      overallAverage:
        type: number
      subjectAverage:
        type: number
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  response.GradeDetail:
    properties:
      assessedAt:
        type: string
      gradeId:
        type: string
      notes:
        type: string
      sessionId:
        type: string
      student:
        $ref: '#/definitions/response.UserProfile'
      value:
        type: number
    type: object
  response.GradeTableResponse:
    properties:
      grades:
        items:
          $ref: '#/definitions/response.GradeDetail'
        type: array
      group:
        $ref: '#/definitions/response.GroupSummary'
      meta:
        $ref: '#/definitions/response.PageMeta'
      sessions:
        items:
          $ref: '#/definitions/response.SessionSummary'
        type: array
      students:
        items:
          $ref: '#/definitions/response.UserProfile'
        type: array
      subject:
        $ref: '#/definitions/response.SubjectSummary'
    type: object
  response.GroupRankingItem:
    properties:
      average:
        type: number
      group:
        $ref: '#/definitions/response.GroupSummary'
    type: object
  response.GroupRankingResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.GroupRankingItem'
        type: array
    type: object
  response.GroupSummary:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  response.PageMeta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  response.PaginatedGroupSummaries:
    properties:
      data:
        items:
          $ref: '#/definitions/response.GroupSummary'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  response.PaginatedStudentSubjects:
    properties:
      data:
        items:
          $ref: '#/definitions/response.StudentSubjectGrade'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  response.PaginatedSubjectSummaries:
    properties:
      data:
        items:
          $ref: '#/definitions/response.SubjectSummary'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  response.PaginatedUserProfiles:
    properties:
      data:
        items:
          $ref: '#/definitions/response.UserProfile'
        type: array
      meta:
        $ref: '#/definitions/response.PageMeta'
    type: object
  response.ScheduleEntry:
    properties:
      group:
        $ref: '#/definitions/response.GroupSummary'
      session:
        $ref: '#/definitions/response.SessionSummary'
      subject:
        $ref: '#/definitions/response.SubjectSummary'
      teacher:
        $ref: '#/definitions/response.UserProfile'
    type: object
  response.SessionSummary:
    properties:
      endsAt:
        type: string
      groupId:
        type: string
      id:
        type: string
      startsAt:
        type: string
      subjectId:
        type: string
      topic:
        type: string
    type: object
  response.StudentDashboardResponse:
    properties:
      averageGpa:
        type: number
      group:
        $ref: '#/definitions/response.GroupSummary'
      profile:
        $ref: '#/definitions/response.UserProfile'
    type: object
  response.StudentSessionGrade:
    properties:
      grade:
        type: number
      gradeId:
        type: string
      notes:
        type: string
      session:
        $ref: '#/definitions/response.SessionSummary'
    type: object
  response.StudentSubjectGrade:
    properties:
      average:
        type: number
      sessions:
        items:
          $ref: '#/definitions/response.StudentSessionGrade'
        type: array
      subject:
        $ref: '#/definitions/response.SubjectSummary'
    type: object
  response.SubjectSummary:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  response.TeacherDashboardResponse:
    properties:
      profile:
        $ref: '#/definitions/response.UserProfile'
      subjects:
        items:
          $ref: '#/definitions/response.TeacherSubjectSummary'
        type: array
    type: object
  response.TeacherSubjectSummary:
    properties:
      groups:
        items:
          $ref: '#/definitions/response.GroupSummary'
        type: array
      subject:
        $ref: '#/definitions/response.SubjectSummary'
    type: object
  response.UserProfile:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      firstName:
        type: string
      group:
        $ref: '#/definitions/response.GroupSummary'
      id:
        type: string
      ins:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      role:
        type: string
      staffPosition:
        type: string
      subjects:
        items:
          $ref: '#/definitions/response.SubjectSummary'
        type: array
      teacherBio:
        type: string
      teacherTitle:
        type: string
    type: object
  response.UserSummary:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      ins:
        type: string
      lastName:
        type: string
      middleName:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
    type: object
info:
  contact: {}
  description: GradeFlow management API.
  title: GradeFlow API
  version: 0.1.0
paths:
  /admin/deans:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search phrase
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedUserProfiles'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List dean staff
      tags:
      - Admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Dean payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.CreateDeanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create dean staff
      tags:
      - Admin
  /admin/deans/{deanId}:
    delete:
      parameters:
      - description: Dean ID
        in: path
        name: deanId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete dean
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: Dean ID
        in: path
        name: deanId
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.UpdateDeanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update dean profile
      tags:
      - Admin
  /admin/deans/{deanId}/restore:
    post:
      parameters:
      - description: Dean ID
        in: path
        name: deanId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore dean
      tags:
      - Admin
  /admin/groups/{groupId}/restore:
    post:
      parameters:
      - description: Group ID
        in: path
        name: groupId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore group
      tags:
      - Admin
  /admin/groups/deleted:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search phrase
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedGroupSummaries'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List deleted groups
      tags:
      - Admin
  /admin/subjects/{subjectId}/restore:
    post:
      parameters:
      - description: Subject ID
        in: path
        name: subjectId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore subject
      tags:
      - Admin
  /admin/subjects/deleted:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search phrase
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedSubjectSummaries'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List deleted subjects
      tags:
      - Admin
  /admin/users:
    get:
      parameters:
      - description: Role (student|teacher|dean)
        in: query
        name: role
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search phrase
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedUserProfiles'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users by role
      tags:
      - Admin
  /admin/users/{userId}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete user by ID
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Admin
  /admin/users/{userId}/avatar:
    delete:
      parameters:
      - description: ID пользователя
        in: path
        name: userId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить аватар пользователя
      tags:
      - Admin
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID пользователя
        in: path
        name: userId
        required: true
        type: string
      - description: Файл изображения
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить аватар пользователя
      tags:
      - Admin
  /admin/users/{userId}/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: New password
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset user password
      tags:
      - Admin
  /admin/users/{userId}/restore:
    post:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore user by ID
      tags:
      - Admin
  /admin/users/deleted:
    get:
      parameters:
      - description: Role (student|teacher|dean)
        in: query
        name: role
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search phrase
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedUserProfiles'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List deleted users by role
      tags:
      - Admin
  /auth/login/ins:
    post:
      consumes:
      - application/json
      description: Authenticates student/teacher/dean using individual number.
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.INSLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login by INS
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /auth/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Password change payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.ChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges refresh token for a new access token.
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /dean/grades/{gradeId}:
    patch:
      consumes:
