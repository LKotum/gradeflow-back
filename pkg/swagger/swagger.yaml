  contact: {}
  description: API for schedule, assessments, attendance and grades.
  title: GradeFlow API
  version: 0.1.0
paths:
  /academic-sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AcademicSessionList'
      summary: List academic sessions
      tags:
      - academic-sessions
    post:
      consumes:
      - application/json
      parameters:
      - description: session
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.CreateAcademicSession'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.AcademicSession'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
      summary: Create academic session
      tags:
      - academic-sessions
  /academic-sessions/{id}:
    delete:
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Delete academic session
      tags:
      - academic-sessions
    get:
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AcademicSession'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get academic session
      tags:
      - academic-sessions
    put:
      consumes:
      - application/json
      parameters:
      - description: session id
        in: path
        name: id
        required: true
        type: string
      - description: session
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/request.UpdateAcademicSession'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AcademicSession'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
      summary: Update academic session
      tags:
      - academic-sessions
  /admins:
    get:
      parameters:
      - description: search by name
        in: query
        name: q
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
